<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Kantor Virtual · PT Mencari Cinta Sejati</title>
<meta name="theme-color" content="#2a1420">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1420;--pink:#ff4f7b;--pink2:#ffb3c6;--cream:#fff6ef;--yellow:#ffd23f;--muted:#8a6b77;--display:"Fredoka",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#f5c9d4;font-family:var(--body);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input,select{font:inherit}
.pill,.btn{font-family:var(--display);font-weight:700;border:3px solid var(--ink);border-radius:999px;background:var(--cream);color:var(--ink);padding:6px 14px;font-size:15px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn{background:var(--pink);color:#fff}
.btn.putih{background:var(--cream);color:var(--ink)}
.pill:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#top .logo{background:var(--pink);color:#fff}
#online{cursor:default;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){#top .pill{font-size:13px;padding:5px 10px}}
#online i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-right:6px;vertical-align:1px}
#online.lokal i{background:#f39c12}
#top .isi{flex:1}
#tempat{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 46px);left:10px;right:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:5;padding-bottom:6px}
#tempat::-webkit-scrollbar{display:none}
#tempat .pill{font-size:13px;padding:4px 11px;box-shadow:0 3px 0 var(--ink);background:rgba(255,246,239,.92)}

#log{position:fixed;left:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 52px);width:min(380px,calc(100% - 20px));display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:4}
#log p{margin:0;background:rgba(42,20,32,.72);color:#fff;padding:5px 10px;border-radius:12px;font-size:14px;line-height:1.3;width:fit-content;max-width:100%;overflow-wrap:anywhere;transition:opacity 1s}
#log p b{color:var(--pink2)}
#log p.sys{background:rgba(255,79,123,.85)}
/* ===== MAIN BARENG: duel & kuis kilat ===== */
.duelPapan{margin:10px auto 6px}
.duelPapan.xox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px}
.duelPapan.xox button{aspect-ratio:1;font-size:clamp(34px,11vw,48px);border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0}
.duelPapan.xox button:disabled{cursor:default;opacity:1;color:inherit}.duelPapan.xox button:not(:disabled):hover{background:#fff0f4}
.duelPapan .garisMenang{background:#ffd23f!important;animation:mahkotaDenyut 1.2s ease-in-out infinite}
.duelPapan.empat{max-width:340px}
.empatKolom{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.empatKolom button{height:30px;border:2px solid var(--ink);border-radius:8px;background:var(--pink);color:#fff;font-size:13px;cursor:pointer;padding:0}.empatKolom button:disabled{background:#d8c7ce;cursor:default}
.empatGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#3a6ea5;padding:7px;border-radius:14px;border:3px solid var(--ink)}
.empatGrid span{aspect-ratio:1;border-radius:50%;background:#fff6ef;display:grid;place-items:center;font-size:clamp(15px,5vw,24px);box-shadow:inset 0 3px 0 rgba(0,0,0,.18)}
.suitSkor{display:flex;justify-content:center;align-items:center;gap:18px;font:700 38px Fredoka,sans-serif}.suitSkor span{font:800 13px Nunito,sans-serif;color:var(--muted)}
.suitRiwayat{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}.suitRiwayat span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:14px}
.suitPilih{display:flex;gap:10px;justify-content:center;margin-top:6px}
.suitPilih button{width:92px;height:104px;font-size:42px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.suitPilih button small{font:800 12px Nunito,sans-serif}.suitPilih button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.duelPapan.suit p{text-align:center}
.kilatHasil{background:#fff0f4;border:2px solid var(--pink);border-radius:12px;padding:8px 10px}
.pilihEmpat .dipilih{outline:4px solid #ffd23f;outline-offset:-2px}
.peringkat.kecilP{margin-top:8px}.peringkat.kecilP li{padding:3px 10px;font-size:14px}

/* ===== GAME CENTER ===== */
.gameGrid button{display:flex;flex-direction:column;align-items:center;text-align:center}.gIkon{font-size:30px;line-height:1.1;margin-bottom:2px}
.memoriInfo{display:flex;justify-content:space-between;gap:6px;font-weight:900;font-size:14px;margin:4px 0 8px}
.memori{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;perspective:600px;max-width:340px;margin:0 auto}
.mKartu{position:relative;aspect-ratio:1;width:100%;min-width:0;margin:0;border:0;background:none;padding:0;cursor:pointer;transform-style:preserve-3d;transition:transform .35s}
.mKartu span{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;border:3px solid var(--ink);backface-visibility:hidden;font-size:clamp(26px,8vw,38px)}
.mKartu .belakang{background:linear-gradient(135deg,#ff4f7b,#ff8fab);font-size:24px}
.mKartu .depan{background:#fff6ef;transform:rotateY(180deg)}
.mKartu.buka,.mKartu.cocok{transform:rotateY(180deg)}.mKartu.cocok .depan{background:#b9f3c9;box-shadow:0 0 12px #2f9e6e}
.dpad{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 calc(max(10px,env(safe-area-inset-bottom)) + 6px)}
.dpad div{display:flex;gap:60px}.dpad button{width:58px;height:58px;border-radius:16px;border:3px solid #fff;background:rgba(255,255,255,.12);color:#fff;font-size:22px;touch-action:manipulation}
.kataGrid{display:grid;gap:6px;justify-content:center;margin:8px 0}.kaBaris{display:grid;grid-template-columns:repeat(5,min(44px,13vw));gap:6px}
.kaBaris span{height:44px;display:grid;place-items:center;border:2px solid #d8c7ce;border-radius:8px;font:700 22px Fredoka,sans-serif;text-transform:uppercase;background:#fff}
.kaBaris span.isi{border-color:var(--ink)}.kaBaris span.kH,.kataKeyboard .kH{background:#2f9e6e;border-color:#2f9e6e;color:#fff}.kaBaris span.kK,.kataKeyboard .kK{background:#e0b020;border-color:#e0b020;color:#fff}.kaBaris span.kX,.kataKeyboard .kX{background:#6b6170;border-color:#6b6170;color:#fff}
.kataKeyboard{display:flex;flex-direction:column;gap:5px;margin-top:6px}.kataKeyboard div{display:flex;gap:4px;justify-content:center}
.kataKeyboard button{flex:1;max-width:34px;height:42px;border:2px solid var(--ink);border-radius:8px;background:#fff6ef;font:800 15px Nunito,sans-serif;cursor:pointer;padding:0}.kataKeyboard button.lebar{max-width:64px;flex:1.6;font-size:12px}
.rodaWadah{position:relative;width:min(320px,100%);margin:6px auto}.rodaWadah canvas{width:100%;height:auto;display:block}
.rodaPanah{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:30px;color:#2a1420;text-shadow:0 2px 0 #fff}

/* ===== GAYA EKSKLUSIF DIREKTUR: semua yang berasal dari Direktur tampil hitam-emas berkilau ===== */
@keyframes kilauEmas{0%{background-position:-160% 0}60%,100%{background-position:260% 0}}
@keyframes mahkotaDenyut{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
.dirTag{display:inline-block;font:900 10px/1 Nunito,sans-serif;letter-spacing:1.4px;color:#2a1a06;background:linear-gradient(90deg,#c9971c,#ffe27a,#c9971c);padding:4px 8px;border-radius:999px;margin:0 0 4px;box-shadow:0 0 10px rgba(255,210,63,.45)}
.dm.dmDir span{position:relative;background:linear-gradient(135deg,#1c1206,#3d2a0a 55%,#1c1206);color:#ffe9a0;border:2px solid #ffd23f;box-shadow:0 0 14px rgba(255,210,63,.45),inset 0 0 12px rgba(255,210,63,.12);font-weight:800;overflow:hidden}
.dm.dmDir span::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,240,180,.35) 50%,transparent 65%);background-size:250% 100%;animation:kilauEmas 3.2s ease-in-out infinite;pointer-events:none}
.dm.dmDir small{color:#b8890f}
.balasDir{background:linear-gradient(135deg,#1c1206,#3d2a0a);color:#ffe9a0;border:2px solid #ffd23f;border-radius:10px;padding:6px 9px}.balasDir b{color:#ffd23f}
.daftar>div.grupDir{background:linear-gradient(135deg,#1c1206,#3d2a0a);color:#ffe9a0;border:2px solid #ffd23f;border-radius:12px;padding:8px 10px;box-shadow:0 0 12px rgba(255,210,63,.3)}.daftar>div.grupDir small{color:#e9c96a}
.lencanaDir{color:#ffd23f;font-weight:900}
#kartu.kartuDir .isi{background:radial-gradient(120% 90% at 50% 0%,#4a3210 0%,#1c1206 70%);color:#ffe9a0;border-color:#ffd23f;box-shadow:0 0 0 3px #1c1206,0 0 34px rgba(255,210,63,.55),0 8px 0 #8a6a12}
#kartu.kartuDir .isi h2,#kartu.kartuDir .isi h3{color:#ffd23f}#kartu.kartuDir .isi .kecil,#kartu.kartuDir .isi small{color:#e9c96a}
#kartu.kartuDir .isi .x{background:#ffd23f;color:#1c1206;border-color:#1c1206}
#kartu.kartuDir .daftar>div{background:rgba(255,210,63,.07);border-color:rgba(255,210,63,.35);color:#ffe9a0}
#kartu.kartuDir input,#kartu.kartuDir textarea{background:#fff8e6}
.suratDir{text-align:center}.kutipSaran{font-style:italic;background:rgba(0,0,0,.06);border-left:4px solid #ffd23f;border-radius:8px;padding:8px 10px;margin:0 0 10px;text-align:left}#kartu.kartuDir .kutipSaran{background:rgba(255,210,63,.1);color:#f3dca0}.stSaran{color:#2f9e6e;font-weight:800}.suratDir .dirTag{position:relative;z-index:1;margin-top:10px}
#umum .dirTag{display:block;width:fit-content;margin-bottom:6px}
.dm .dirTag{align-self:flex-start;width:fit-content}.dm.saya .dirTag{align-self:flex-end}.suratDir h2{font-size:24px;margin:6px 0 10px}
.mahkotaDir{font-size:54px;line-height:1;margin:0 0 14px;filter:drop-shadow(0 0 12px rgba(255,210,63,.7));animation:mahkotaDenyut 2.4s ease-in-out infinite}
.isiSurat{font-size:18px;line-height:1.55;background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.4);border-radius:14px;padding:14px;margin:0 0 10px;color:#fff3cf}
.ttdDir{font-family:Fredoka,sans-serif;font-size:18px;color:#ffd23f;text-align:right;margin:0 4px 12px}.ttdDir small{font-family:Nunito,sans-serif;font-size:12px}
.btn.emas{background:linear-gradient(90deg,#c9971c,#ffe27a,#c9971c);color:#1c1206;border-color:#1c1206;box-shadow:0 4px 0 #1c1206}
#umum{background:radial-gradient(120% 120% at 50% 0%,#4a3210 0%,#1c1206 75%)!important;color:#fff3cf!important;border-color:#ffd23f!important;box-shadow:0 0 22px rgba(255,210,63,.55),0 4px 0 #8a6a12!important;overflow:hidden}
#umum::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,240,180,.25) 50%,transparent 65%);background-size:250% 100%;animation:kilauEmas 3.6s ease-in-out infinite;pointer-events:none}
#umum span{display:block;font-weight:800;padding-right:30px}#umum span em{display:block;text-align:right;font-style:normal;color:#ffd23f;font-family:Fredoka,sans-serif;margin-top:4px}
#umum button{background:#ffd23f!important;border-color:#1c1206!important;z-index:1}
#log p.dir{background:linear-gradient(135deg,#1c1206,#3d2a0a)!important;border:2px solid #ffd23f;color:#ffe9a0;box-shadow:0 0 12px rgba(255,210,63,.45);position:relative;overflow:hidden}
#log p.dir::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,240,180,.3) 50%,transparent 65%);background-size:250% 100%;animation:kilauEmas 3s ease-in-out infinite}

.titikWarna{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #2a1420;margin-right:5px;vertical-align:-1px}
.kotakInfo{border:2px dashed #ffb3c6;border-radius:12px;padding:8px 12px;margin:6px 0 12px}.kotakInfo summary{cursor:pointer}.aksiInfo{white-space:nowrap}.infoList>div{align-items:flex-start}
#log p.dir{background:rgba(30,18,4,.92);border:2px solid #ffd23f;color:#ffe9a0}#log p.dir b{color:#ffd23f}
#log p.pudar{opacity:0}
#chatF{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));width:min(380px,calc(100% - 140px));display:flex;gap:6px;z-index:5}
#chatI{flex:1;min-width:0;border:3px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:16px;background:rgba(255,246,239,.95);color:var(--ink)}
#chatF .btn{padding:6px 12px}

#aksi{position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:6;font-size:17px;padding:12px 20px;background:var(--yellow);color:var(--ink)}
#aksi kbd{font:inherit;font-size:12px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
@media (hover:none){#aksi kbd{display:none}}
@media (max-width:600px){#aksi{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 54px);font-size:15px;padding:9px 16px}#chatF{width:calc(100% - 20px)}#log{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 104px)}}

#btnKam{position:fixed;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 96px);z-index:5;font-size:13px;padding:5px 11px}
@media (max-width:600px){#btnKam{top:auto;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 104px)}}
#btnMusik{position:fixed;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 168px);z-index:5;font-size:15px;padding:5px 11px}#btnMusik.mati{opacity:.55}
@media (max-width:600px){#btnMusik{top:auto;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 176px)}}
.aturSuara label.cek{margin-top:6px}.aturSuara input[type=range]{width:100%;accent-color:#ff4f7b}
#btnEmote{position:fixed;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 132px);z-index:5;font-size:16px;padding:4px 10px}
#menuEmote{position:fixed;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 168px);z-index:8;display:flex;flex-direction:column;gap:4px;background:#fff6ef;border:3px solid var(--ink);border-radius:14px;padding:6px}
#menuEmote[hidden]{display:none}#menuEmote button{font-size:22px;border:0;background:none;cursor:pointer;padding:2px 4px}
@media (max-width:600px){#btnEmote{top:auto;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 140px)}#menuEmote{top:auto;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 176px)}}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,246,239,.25);border:3px solid rgba(42,20,32,.35);display:none;pointer-events:none;z-index:3;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,79,123,.85);border:3px solid var(--ink)}
#bantuJoy{position:fixed;left:24px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 200px);color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 4px #000;pointer-events:none;z-index:3;display:none}
@media (hover:none){#bantuJoy{display:block}}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:20;text-align:center;max-width:calc(100% - 40px)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

#kartu{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:16px;background:rgba(42,20,32,.35)}
#kartu[hidden]{display:none}
#kartu.bawah{place-items:end center;background:transparent;pointer-events:none}
#kartu .isi{pointer-events:auto;background:var(--cream);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:20px;width:min(440px,100%);max-height:calc(100% - 24px);overflow:auto;position:relative}
#kartu.bawah .isi{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 20px));max-height:none;overflow:visible;padding:16px}
.sw.tab{margin-bottom:12px}
.sw.tab button.on{background:var(--ink);color:#fff;outline:0}
.sw.pilih{min-height:40px}
#kartu.bawah h2{font-size:20px}
#kartu.bawah label{margin:8px 0 3px}
@media (min-width:900px){#kartu.bawah .isi{left:auto;right:24px;bottom:auto;top:96px;transform:none;width:400px}}
#kartu h2{font-family:var(--display);font-size:24px;margin:0 0 6px;line-height:1.15;padding-right:34px}
#kartu p{margin:6px 0 12px;line-height:1.45}
#kartu .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-weight:900;cursor:pointer;line-height:1}
#kartu label{display:block;font-weight:900;font-size:13px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
#kartu input,#kartu select,#kartu textarea{width:100%;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:16px;background:#fff;color:var(--ink)}
#kartu .baris{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#kartu .err{color:#c0392b;font-weight:800;min-height:1.2em;margin:8px 0 0}
#kartu .kecil{font-size:13px;color:var(--muted)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:10px;border:3px solid var(--ink);cursor:pointer;padding:0}
.sw button.on{outline:3px solid var(--pink);outline-offset:2px}
.sw.teks button{width:auto;padding:4px 10px;background:#fff;font-weight:800;font-size:13px}
.daftarNama{max-height:240px;overflow:auto;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 10px;margin-top:8px}
.daftarNama div{padding:4px 0;border-bottom:1px dashed #e7d3da;font-weight:700}
.daftarNama div:last-child{border:0}
.daftarNama small{color:var(--muted);font-weight:700}

#loading{position:fixed;inset:0;display:grid;place-items:center;background:#ffd9e2;z-index:30;font-family:var(--display);font-size:22px;text-align:center;transition:opacity .5s}
#loading .hati{font-size:56px;display:block;animation:dug 1s infinite}
@keyframes dug{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){#loading .hati{animation:none}}
#loading.hilang{opacity:0;pointer-events:none}
/* ---- tamu, interaksi & direktur ---- */
#top .emas{background:#f2b33d}
#btnObrolan{position:relative}
#badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font:900 12px/18px var(--body);border:2px solid var(--ink);padding:0 4px}
#online{font-size:15px}
@media (max-width:480px){#top .lg{display:none}#top .isi{display:none}#top{gap:5px}#top .pill{padding:5px 9px}#btnProfil{max-width:96px;overflow:hidden;text-overflow:ellipsis}#online i{display:none}}
